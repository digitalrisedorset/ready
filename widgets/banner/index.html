<!DOCTYPE html>
<html>
<body>

<script type="module">
    import { mount } from './api/widget.ts';
    import { ResourceLoader } from "@reactedge/framework/contract";

    const loader = new ResourceLoader();
    const contract = await loader.loadContract("single.json");

    const element = document.querySelector('banner-widget');

    await requestAnimationFrame(() => {
        mount(element, contract);
    })
</script>

<banner-widget></banner-widget>

</body>
</html>
