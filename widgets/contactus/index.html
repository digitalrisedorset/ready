<!DOCTYPE html>
<html>
<body>

<script type="module">
    import { mount } from './api/runtime-widget.ts';
    import { ResourceLoader } from "@reactedge/framework/contract";

    const loader = new ResourceLoader();
    const contract = await loader.loadContract("default.json");
    const runtime = await loader.loadRuntime();

    const element = document.querySelector('contactus-widget');

    await requestAnimationFrame(() => {
        mount(element, contract, runtime);
    })
</script>

<contactus-widget></contactus-widget>
<div id="contactus-turnstile"></div>

</body>
</html>
