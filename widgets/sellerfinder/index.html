<!DOCTYPE html>
<html>
<body>

<script type="module">
    import { mount } from './api/runtime-widget.ts';
    import { loadContract } from "@reactedge/framework/contract";
    import {loadRuntime} from "./src/lib/load-runtime.js";
    const config = await loadContract('default.json')
    const element = document.querySelector('sellerfinder-widget');
    const runtime = await loadRuntime();

    await requestAnimationFrame(() => {
        mount(element, config, runtime);
    })
</script>

<sellerfinder-widget></sellerfinder-widget>

</body>
</html>
